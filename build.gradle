plugins {
    id 'dev.architectury.loom' version "${architectury_loom_version}-SNAPSHOT" apply false
    id 'architectury-plugin' version "${architectury_plugin_version}-SNAPSHOT"
    id 'com.gradleup.shadow' version "${gradleup_shadow_version}" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    if (project.name != "common") {
        processResources {
            inputs.property "version", project.version
            inputs.property "mod_id", project.mod_id
            inputs.property "mod_name", project.mod_name
            inputs.property "mod_description", project.mod_description
            inputs.property "mod_author", project.mod_author
            inputs.property "license", project.license
            inputs.property "minecraft_version", project.minecraft_version
            inputs.property "minecraft_version_range", project.minecraft_version_range
            inputs.property "fabric_loader_version", project.fabric_loader_version
            inputs.property "neoforge_version", project.neoforge_version

            filesMatching("fabric.mod.json") {
                expand(
                        version: project.version,
                        mod_id: project.mod_id,
                        mod_name: project.mod_name,
                        mod_description: project.mod_description,
                        mod_author: project.mod_author,
                        license: project.license,
                        minecraft_version: project.minecraft_version,
                        fabric_loader_version: project.fabric_loader_version,
                )
            }

            filesMatching("META-INF/neoforge.mods.toml") {
                expand(
                        version: project.version,
                        mod_id: project.mod_id,
                        mod_name: project.mod_name,
                        mod_description: project.mod_description,
                        mod_author: project.mod_author,
                        license: project.license,
                        minecraft_version_range: project.minecraft_version_range,
                        neoforge_version: project.neoforge_version,
                )
            }
        }
    }

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
